<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#080706;}
a{color:#e0a33e;text-decoration:none}
a:hover{color:#f0bd63}
input{font-family:inherit}
@keyframes hit{0%{transform:scaleY(1);filter:brightness(1)}35%{transform:scaleY(1.6);filter:brightness(1.8)}100%{transform:scaleY(1);filter:brightness(1)}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes sweep{0%{transform:translateY(-120%)}100%{transform:translateY(680%)}}
@keyframes driftA{0%{transform:scale(1.06) translate(0,0)}100%{transform:scale(1.13) translate(-1.5%,1%)}}
@keyframes driftB{0%{transform:scale(1.06) translate(0,0)}100%{transform:scale(1.13) translate(1.5%,-1%)}}
@keyframes cutA{0%{opacity:.42}70%{opacity:.06}100%{opacity:0}}
@keyframes cutB{0%{opacity:.42}70%{opacity:.06}100%{opacity:0}}
@keyframes riseA{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes riseB{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tickA{0%{opacity:0;letter-spacing:.06em}100%{opacity:1;letter-spacing:-.01em}}
@keyframes tickB{0%{opacity:0;letter-spacing:.06em}100%{opacity:1;letter-spacing:-.01em}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(224,163,62,.45)}50%{box-shadow:0 0 20px rgba(224,163,62,.85)}}
</style>
</helmet>

<div style="min-height:100vh;background:#080706;padding:40px;box-sizing:border-box;font-family:'IBM Plex Sans','Noto Sans TC',sans-serif">
  <div style="max-width:1180px;margin:0 auto;background:#0d0c0a;border:1px solid #221f1a;padding:34px 36px 30px;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;border-bottom:1px solid #201d18;padding-bottom:18px">
      <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
        <div style="font-size:20px;color:#efe6d8;font-weight:400">記憶帳本</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:#968e7f">24H · CAM 01 · JETSON ORIN</div>
      </div>
      <div style="display:flex;align-items:center;gap:20px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#a89f8f">
        <div style="display:flex;align-items:center;gap:8px;border:1px solid #33291a;padding:5px 10px">
          <span style="width:6px;height:6px;background:#e0a33e;animation:breathe 2.4s ease-in-out infinite"></span><span style="letter-spacing:.12em;white-space:nowrap">OFFLINE · 無雲端連線</span>
        </div>
        <div style="display:flex;align-items:flex-end;gap:2px;height:14px">
          <sc-for list="{{ v.lat }}" as="b" hint-placeholder-count="8"><span style="{{ b.style }}"></span></sc-for>
        </div>
        <span style="color:#e0a33e;white-space:nowrap">推論 {{ v.latency }}s</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:34px;align-items:start">
      <div style="display:flex;flex-direction:column;gap:20px">
        <div style="position:relative;aspect-ratio:16/9;background:#0a0907;border:1px solid #2b241a;overflow:hidden">
          <div style="{{ v.ev.frame }}"></div>
          <div style="position:absolute;left:10%;right:10%;bottom:16%;height:24%;background:rgba(200,170,120,.05);border-top:1px solid rgba(220,180,120,.12)"></div>
          <div style="position:absolute;inset:0;background:repeating-linear-gradient(rgba(0,0,0,.32) 0 1px, rgba(0,0,0,0) 1px 3px)"></div>
          <div style="position:absolute;inset:0;box-shadow:inset 0 0 130px 34px rgba(0,0,0,.6)"></div>
          <div style="position:absolute;left:0;right:0;height:16%;background:linear-gradient(rgba(224,163,62,.07),rgba(224,163,62,0));animation:sweep 8s linear infinite;pointer-events:none"></div>
          <div style="{{ v.cut }}"></div>
          <div style="position:absolute;top:12px;left:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;white-space:nowrap;color:rgba(232,216,190,.8)">FRAME {{ v.ev.frameId }} · 影像佔位</div>
        </div>
        <div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap">
          <div style="{{ v.hmStyle }}">{{ v.ev.hm }}</div>
          <div style="display:flex;flex-direction:column;gap:8px;padding-top:2px;flex:1;min-width:260px">
            <div style="{{ v.textStyle }}">{{ v.ev.text }}</div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#968e7f;letter-spacing:.1em">{{ v.ev.stamp }} · 信心 {{ v.ev.conf }} · 本地索引 #{{ v.ev.id }}</div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:9px;border-bottom:1px solid #2b241a;padding:0 2px 10px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#e0a33e">?</span>
          <input value="{{ v.q }}" onInput="{{ v.onQuery }}" placeholder="搜尋這個空間的記憶" style="flex:1;min-width:0;background:transparent;border:0;outline:0;color:#eee5d6;font-family:'IBM Plex Mono',monospace;font-size:12.5px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#968e7f;letter-spacing:.12em;white-space:nowrap">{{ v.resultLabel }}</span>
        </div>
        <div style="display:flex;flex-direction:column;max-height:392px;overflow:auto">
          <sc-for list="{{ v.ledger }}" as="r" hint-placeholder-count="9">
            <div onClick="{{ r.pick }}" style="{{ r.style }}" style-hover="background:rgba(224,163,62,.07)">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:{{ r.timeColor }};min-width:44px">{{ r.hm }}</span>
              <span style="font-size:12.5px;line-height:1.55;color:{{ r.textColor }}">{{ r.text }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:7px;border-top:1px solid #201d18;padding-top:10px">
      <div onPointerDown="{{ v.track.onPointerDown }}" onPointerMove="{{ v.track.onPointerMove }}" onPointerUp="{{ v.track.onPointerUp }}" style="position:relative;height:44px;display:flex;align-items:center;gap:2px;cursor:ew-resize;touch-action:none">
        <sc-for list="{{ v.bars }}" as="b" hint-placeholder-count="96"><span style="{{ b.style }}"></span></sc-for>
        <span style="{{ v.cursorStyle }}"></span>
      </div>
      <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#968e7f;letter-spacing:.14em">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="7"><span>{{ h }}</span></sc-for>
      </div>
      <div style="display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#968e7f;letter-spacing:.12em">
        <span>拖曳時間軸以回放記憶</span><span>{{ v.count }} 個事件</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;latency&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0.38&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const EVENTS = [
  [7,12,4,'有人打開百葉窗,晨光進入房間','窗 百葉窗 光'],
  [7,48,31,'一個白色馬克杯被放在桌子右側','馬克杯 杯子 桌子'],
  [8,30,9,'桌上的黑色充電器被插上電源','充電器 電源 桌子'],
  [9,5,52,'有人把灰色背包放在椅子上','背包 椅子'],
  [9,41,17,'兩個人在白板前討論,約四分鐘','白板 人 討論'],
  [10,42,7,'有人拿走桌上的黑色充電器','充電器 桌子 拿走'],
  [11,15,44,'一份文件被留在印表機上','文件 印表機'],
  [12,3,21,'桌面被清空,只剩鍵盤','桌面 鍵盤'],
  [13,20,38,'白色馬克杯被拿離桌面','馬克杯 杯子'],
  [14,7,12,'一台筆電被放在桌子中央','筆電 桌子'],
  [15,33,55,'窗邊的植物被移到書架旁','植物 書架 窗'],
  [16,19,3,'黑色充電器出現在窗邊的插座','充電器 插座 窗'],
  [17,2,29,'有人帶走椅子上的灰色背包','背包 椅子'],
  [18,45,48,'印表機上的文件被取走','文件 印表機'],
  [20,10,33,'房間燈光關閉,桌面無變化','燈光 桌面'],
  [23,37,16,'門口短暫有人經過,未進入房間','門口 人 移動']
].map((e, i) => ({
  id: 1024 + i * 7, min: e[0] * 60 + e[1], sec: e[2], text: e[3], tags: e[4],
  hm: String(e[0]).padStart(2, '0') + ':' + String(e[1]).padStart(2, '0'),
  stamp: String(e[0]).padStart(2, '0') + ':' + String(e[1]).padStart(2, '0') + ':' + String(e[2]).padStart(2, '0'),
  conf: (0.72 + ((i * 13) % 24) / 100).toFixed(2),
  frameId: 100000 + i * 4177
}));

const C = { accent: '224,163,62', ink: '238,229,214', dim: '150,142,127', bg: '18,15,10', tint: '26,20,12', barH: 40 };

class Component extends DCLogic {
  state = { cur: 5, q: '', drag: false };

  matches(ev, q) {
    const s = q.trim();
    if (!s) return false;
    return (ev.text + ' ' + ev.tags).toLowerCase().includes(s.toLowerCase());
  }

  nearest(minute) {
    let best = 0, d = 1e9;
    EVENTS.forEach((e, i) => { const dd = Math.abs(e.min - minute); if (dd < d) { d = dd; best = i; } });
    return best;
  }

  renderVals() {
    const latency = this.props.latency ?? '0.38';
    const q = this.state.q, ev = EVENTS[this.state.cur];
    const hits = EVENTS.filter(e => this.matches(e, q));
    const activeBucket = Math.floor(ev.min / 15);

    const bars = [];
    for (let i = 0; i < 96; i++) {
      const center = i * 15 + 7.5;
      let w = 0, hit = false;
      EVENTS.forEach(e => {
        const d = Math.abs(e.min - center);
        const g = Math.exp(-(d * d) / 1400);
        w += g;
        if (g > 0.25 && this.matches(e, q)) hit = true;
      });
      const on = i === activeBucket;
      bars.push({
        style: {
          flex: '1 1 0', height: (Math.min(1, w) * (C.barH - 6) + 5) + 'px', borderRadius: '1px',
          background: hit ? `rgba(${C.accent},.95)` : on ? `rgba(${C.accent},.75)` : `rgba(${C.accent},${0.1 + Math.min(1, w) * 0.22})`,
          transformOrigin: 'bottom',
          animation: hit ? 'hit 1.1s ease-out infinite' : 'none',
          transition: 'background .18s linear'
        }
      });
    }

    const move = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      const idx = this.nearest(p * 1440);
      if (this.state.cur !== idx) this.setState({ cur: idx });
    };

    const alt = this.state.cur % 2 ? 'B' : 'A';
    const frame = {
      position: 'absolute', inset: 0,
      animation: `drift${alt} 22s ease-out infinite alternate`,
      backgroundImage:
        `radial-gradient(46% 62% at ${18 + ((this.state.cur * 37) % 62)}% ${26 + ((this.state.cur * 23) % 44)}%, rgba(${C.accent},.16), rgba(0,0,0,0) 62%),` +
        `radial-gradient(30% 40% at ${72 - ((this.state.cur * 19) % 50)}% ${68 - ((this.state.cur * 29) % 40)}%, rgba(${C.tint},.9), rgba(0,0,0,0) 70%),` +
        `linear-gradient(${96 + this.state.cur * 17}deg, rgb(${C.bg}), #05070700 68%)`,
      transition: 'background-image .1s linear'
    };

    return {
      hours: ['00', '04', '08', '12', '16', '20', '24'],
      v: {
        q, latency, count: EVENTS.length, ev: { ...ev, frame }, bars,
        cut: { position: 'absolute', inset: 0, background: `rgba(${C.accent},.16)`, mixBlendMode: 'screen', pointerEvents: 'none', animation: `cut${alt} .42s ease-out forwards` },
        textStyle: { fontSize: '21px', lineHeight: 1.5, color: '#eee5d6', fontWeight: 300, textWrap: 'pretty', animation: `rise${alt} .4s cubic-bezier(.2,.7,.2,1) both` },
        hmStyle: { fontFamily: "'IBM Plex Mono',monospace", fontSize: '38px', fontWeight: 300, color: '#e0a33e', lineHeight: 1, animation: `tick${alt} .32s ease-out both` },
        lat: [0.35, 0.6, 0.45, 0.8, 0.55, 1, 0.5, 0.7].map((n, i) => ({
          style: { width: '3px', height: (4 + n * 10) + 'px', background: `rgba(${C.accent},${0.3 + n * 0.6})`, animation: `breathe ${2 + i * 0.2}s ease-in-out infinite` }
        })),
        onQuery: (e) => this.setState({ q: e.target.value }),
        resultLabel: q.trim() ? `命中 ${hits.length} 筆` : `全部 ${EVENTS.length} 筆`,
        ledger: EVENTS.map((e, i) => ({
          hm: e.hm, text: e.text,
          timeColor: this.matches(e, q) ? `rgb(${C.accent})` : `rgb(${C.dim})`,
          textColor: i === this.state.cur ? `rgb(${C.ink})` : `rgba(${C.ink},.62)`,
          style: {
            display: 'flex', gap: '12px', alignItems: 'baseline', padding: '9px 10px', cursor: 'pointer',
            background: i === this.state.cur ? `rgba(${C.accent},.1)` : 'transparent',
            borderLeft: `1px solid ${i === this.state.cur ? `rgba(${C.accent},.8)` : 'transparent'}`,
            transition: 'background .16s linear'
          },
          pick: () => this.setState({ cur: i })
        })),
        track: {
          onPointerDown: (e) => { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} this.setState({ drag: true }); move(e); },
          onPointerMove: (e) => { if (this.state.drag) move(e); },
          onPointerUp: () => this.setState({ drag: false })
        },
        cursorStyle: {
          position: 'absolute', top: 0, bottom: 0, left: (ev.min / 1440 * 100) + '%', width: '1px',
          background: `rgba(${C.accent},.85)`, pointerEvents: 'none',
          animation: 'glow 2.6s ease-in-out infinite',
          transition: 'left .12s cubic-bezier(.2,.8,.2,1)'
        }
      }
    };
  }
}

</script>
</body>
</html>
